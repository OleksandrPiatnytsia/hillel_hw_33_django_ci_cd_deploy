# pre-commit: black and flake8 run on every "git commit", before the commit
# is made. If one of them finds something, the commit stops:
#   - black fixes the files itself -> look at the changes, "git add" them
#     and commit again;
#   - flake8 only reports -> fix the lines by hand, then commit again.
# CI (.github/workflows/django.yml) runs the same checks on the whole
# project, so the hook only catches the problems earlier, on your machine.
#
# Install once per clone (pre-commit is in requirements-dev.txt):
#   pre-commit install
# Run on all files, not only the changed ones:
#   pre-commit run --all-files
# Skip the hooks for one commit (not recommended, CI still fails):
#   git commit --no-verify
#
# Each hook runs in its own environment that pre-commit builds from the
# repository and tag below (the first run downloads them, later runs use
# the cache). The tags are the same versions as in requirements-dev.txt;
# tests/unit/test_deploy.py fails if they drift apart.
# The settings come from the project files: pyproject.toml for black,
# .flake8 for flake8 (exclude, per-file-ignores, max-line-length).

repos:
  # psf/black-pre-commit-mirror, not psf/black: the same black, but
  # installed from a ready wheel (compiled with mypyc), about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
