# nginx in front of gunicorn (service "nginx" in docker-compose.yml).
# Mounted as /etc/nginx/conf.d/default.conf: the nginx image includes every
# *.conf of that folder into its main nginx.conf (inside the "http" block).
#
#   browser -> localhost:8000 -> nginx :80 -> /static/, /media/  files from volumes
#                                          -> everything else    web:8000 (gunicorn)
#
# Why nginx: it serves files from disk much faster than Python (no worker
# process is busy with a cover image), keeps slow clients away from gunicorn
# (it reads the whole request first and sends the answer at the client's
# speed), and is the one place for request limits, HTTPS and caching rules.

# The group of backend servers; one here. "web" = the service name of
# gunicorn in the Docker network (Docker's DNS), 8000 = its port.
upstream django {
    server web:8000;
}

server {
    listen 80;
    # Any host name: Django checks it itself (ALLOWED_HOSTS)
    server_name _;

    # Largest request body. The nginx default is 1 MB, so a 2 MB cover
    # (COVER_MAX_SIZE_MB in books/forms.py) would be refused by nginx with
    # "413 Request Entity Too Large" before Django could show its own error.
    # 3 MB: the file + the other fields of the form.
    client_max_body_size 3m;

    # Compress text answers on the fly (HTML, CSS, JS, JSON of the API).
    # Images are already compressed: not in the list.
    gzip on;
    gzip_min_length 1024;     # small answers: compressing costs more than it saves
    gzip_proxied any;         # also the answers that came from gunicorn
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_vary on;             # Vary: Accept-Encoding, for caches between us and the client

    # The version of nginx is not shown in the Server header and error pages
    server_tokens off;

    # Static files: from the static_data volume (collectstatic of web).
    # alias: /static/css/style.4f3a.css -> /app/staticfiles/css/style.4f3a.css
    location /static/ {
        alias /app/staticfiles/;
        # The names have a hash of the content (ManifestStaticFilesStorage):
        # a changed file gets a new name, so the browser may keep every file
        # for a year without asking again (immutable).
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Uploaded covers: from the media_data volume (written by web).
    location /media/ {
        alias /app/media/;
        # A cover keeps its name while it exists (a new upload gets a new
        # name), but it may be deleted: a week, not "forever"
        expires 7d;
        # Don't let the browser guess the type from the content: an upload
        # is served only as what its extension says (image/png, ...)
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Everything else: Django
    location / {
        proxy_pass http://django;

        # $http_host: the Host header exactly as the browser sent it, with
        # the port: "localhost:8000". Not $host (no port): Django compares
        # the Origin header of a POST (http://localhost:8000) with the host,
        # and "localhost" alone would fail the CSRF check (403).
        proxy_set_header Host $http_host;

        # The client's address. Set, not appended ($proxy_add_x_forwarded_for
        # would keep whatever the client itself sent in this header, and a
        # client could pretend to be any IP). nginx is the first server the
        # client talks to, so $remote_addr is the real address.
        # gunicorn (forwarded_allow_ips, gunicorn.conf.py) turns it into REMOTE_ADDR.
        proxy_set_header X-Forwarded-For $remote_addr;
        # http or https as the client used it: request.is_secure() and
        # build_absolute_uri() in Django (HTTPS would end here, at nginx)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Location headers of redirects stay as Django made them
        proxy_redirect off;
    }
}
