{% load i18n %}
{# ?q=: the title or the author's name; Enter or the button sends the form #}
{% with field=filter_form.q %}
  <div class="input-group input-group-sm">
    <input type="search" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           class="form-control" value="{{ field.value|default_if_none:'' }}"
           placeholder="{% translate 'Title or author' %}" aria-label="{{ field.label }}">
    <button class="btn btn-outline-secondary" type="submit" aria-label="{% translate 'Find' %}">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m11 11 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
{% endwith %}
