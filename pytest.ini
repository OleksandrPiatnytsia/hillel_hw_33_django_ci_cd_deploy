[pytest]
# pytest-django: which settings to load (the test settings, see the file)
DJANGO_SETTINGS_MODULE = config.settings.test

# Tests live only in tests/ (unit/ and integration/)
testpaths = tests
python_files = test_*.py

# No --reuse-db on purpose: the race test (transaction=True) makes real
# COMMITs, and after it Django empties every table, the groups from the
# data migrations too. A reused database would start the next run without
# them. A new test database every run: migrations take a few seconds.
# --strict-markers a typo in @pytest.mark.<name> is an error, not a new mark
# --cov            measure coverage (settings in .coveragerc); turn it off
#                  for a quick run of one test: pytest --no-cov ...
# --cov-report     two reports on every run:
#                  term-missing:skip-covered - a table in the terminal: the
#                    files below 100% with the numbers of the missed lines;
#                  html - htmlcov/index.html: every file with the missed
#                    lines highlighted (open it in a browser; in .gitignore)
# --cov-fail-under the run fails if the coverage is below 70% (homework rule)
addopts =
    --strict-markers
    --cov
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=70

# pytest-asyncio: "async def test_..." runs in an event loop without
# @pytest.mark.asyncio on every test; a new loop for every test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
